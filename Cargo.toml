[package]
name = "gatheround"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"]}
base64 = "0.23.1"
mlua = { version = "0.12.1", features = ["lua55", "vendored"] }
notify = "8.2.0"
rand = "0.10.2"
raylib = { version = "6.0.0", features = ["raygui"] }
rcgen = "0.14.10"
regex = "1.13.1"
roaring = "0.11.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"]}
tower-cookies = "0.11.0"
tower-http = { version = "0.7.1", features = ["fs"] }
