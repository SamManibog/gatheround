<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Controller</title>
        <link rel="stylesheet" type="text/css" href="/games/style.css">
        <script src="/games/logic.js" defer></script>
    </head>
    <body>
        <div id="joinsDisabledPage" class="maximize, hidden">
            <h1>Waiting for Host to Open Lobby</h1>
        </div>

        <div id="joinPage" class="maximize hidden">
            <p>Pick a Color</p>
            <div class="color-selector">
                <button id="playerRed" class="color-selector-button player-red" type="button" value="red"></button>
                <button id="playerOrange" class="color-selector-button player-orange" type="button" value="orange"></button>
                <button id="playerYellow" class="color-selector-button player-yellow" type="button" value="yellow"></button>
                <button id="playerLime" class="color-selector-button player-lime" type="button" value="lime"></button>
                <button id="playerGreen" class="color-selector-button player-green" type="button" value="green"></button>
                <button id="playerCyan" class="color-selector-button player-cyan" type="button" value="cyan"></button>
                <button id="playerBlue" class="color-selector-button player-blue" type="button" value="blue"></button>
                <button id="playerPurple" class="color-selector-button player-purple" type="button" value="purple"></button>
                <button id="playerPink" class="color-selector-button player-pink" type="button" value="pink"></button>
                <button id="playerBlack" class="color-selector-button player-black" type="button" value="black"></button>
                <button id="playerWhite" class="color-selector-button player-white" type="button" value="white"></button>
                <button id="playerBrown" class="color-selector-button player-brown" type="button" value="brown"></button>
            </div>
        </div>

        <div id="inputPage" class="maximize hidden">
            <div id="trackpad" class="tracking-area"> </div>
        </div>

        <div id="console" class="maximize hidden"></div>
    </body>
</html>
