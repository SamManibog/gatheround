<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Host Dashboard</title>
        <link rel="stylesheet" type="text/css" href="/games/host/style.css">
        <script src="/games/host/logic.js" defer></script>
    </head>
    <body class="hidden">
        <h1>Host Dashboard</h1>
        <h2>Change Page</h2>
        <button id="openLobbyButton" type="button"><h2>Open Lobby</h2></button>
        <button id="openGameSelectorButton" type="button"><h2>Select Game</h2></button>

        <h2>Kick Player</h2>
        <div class="color-selector">
            <button id="kickPlayerRed" class="color-selector-button player-red" type="button" value="red"></button>
            <button id="kickPlayerOrange" class="color-selector-button player-orange" type="button" value="orange"></button>
            <button id="kickPlayerYellow" class="color-selector-button player-yellow" type="button" value="yellow"></button>
            <button id="kickPlayerLime" class="color-selector-button player-lime" type="button" value="lime"></button>
            <button id="kickPlayerGreen" class="color-selector-button player-green" type="button" value="green"></button>
            <button id="kickPlayerCyan" class="color-selector-button player-cyan" type="button" value="cyan"></button>
            <button id="kickPlayerBlue" class="color-selector-button player-blue" type="button" value="blue"></button>
            <button id="kickPlayerPurple" class="color-selector-button player-purple" type="button" value="purple"></button>
            <button id="kickPlayerPink" class="color-selector-button player-pink" type="button" value="pink"></button>
            <button id="kickPlayerBlack" class="color-selector-button player-black" type="button" value="black"></button>
            <button id="kickPlayerWhite" class="color-selector-button player-white" type="button" value="white"></button>
            <button id="kickPlayerBrown" class="color-selector-button player-brown" type="button" value="brown"></button>
        </div>
    </body>
</html>
